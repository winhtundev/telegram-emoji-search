<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Emoji Search</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eef2ff;min-height:100vh;
    background:#0b1020;
    background-image:radial-gradient(900px 500px at 15% -10%,rgba(99,102,241,.45),transparent 60%),
      radial-gradient(800px 500px at 90% 10%,rgba(14,165,233,.35),transparent 60%),
      radial-gradient(700px 500px at 50% 110%,rgba(168,85,247,.30),transparent 60%),
      linear-gradient(180deg,#0b1020,#0d152e 60%,#0b1020);
    background-attachment:fixed}
  header{position:sticky;top:0;z-index:5;padding:18px 16px 14px;
    background:rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid rgba(255,255,255,.16);box-shadow:0 8px 32px rgba(0,0,0,.25)}
  h1{margin:0 0 4px;font-size:clamp(19px,4vw,26px);letter-spacing:.2px}
  p.sub{margin:0 0 12px;color:#c3cdea;font-size:14px;line-height:1.5}
  .row{display:flex;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto;width:100%}
  input[type=search]{flex:1 1 260px;min-width:0;padding:13px 16px;border-radius:14px;font-size:16px;color:#fff;outline:none;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  input[type=search]::placeholder{color:#9aa7c7}
  input[type=search]:focus{border-color:rgba(129,140,248,.9);box-shadow:0 0 0 3px rgba(129,140,248,.25)}
  select{flex:0 1 220px;min-width:0;padding:13px;border-radius:14px;font-size:15px;color:#fff;outline:none;cursor:pointer;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  select option{color:#111}
  main{max-width:1200px;margin:0 auto;padding:20px 16px 40px;width:100%}
  #count{color:#c3cdea;font-size:14px;margin:4px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{padding:12px;cursor:pointer;text-align:center;border-radius:18px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
    box-shadow:0 8px 24px rgba(0,0,0,.22)}
  .card:hover{transform:translateY(-3px);border-color:rgba(129,140,248,.7);box-shadow:0 14px 32px rgba(0,0,0,.30)}
  .media{height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.28)}
  .media img,.media video{max-width:110px;max-height:110px;object-fit:contain}
  .name{font-size:14px;margin:10px 0 2px;line-height:1.35;min-height:38px;word-break:break-word}
  .pack{font-size:12px;color:#aab6d3;word-break:break-all}
  .id{font-size:11px;color:#8b98b8;word-break:break-all;margin-top:4px}
  button.copy{margin-top:10px;width:100%;padding:9px;border:0;border-radius:11px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;
    background:linear-gradient(135deg,#6366f1,#0ea5e9);box-shadow:0 4px 16px rgba(99,102,241,.35)}
  button.copy:active{transform:scale(.98)}
  #more{display:block;margin:24px auto;padding:13px 26px;border:0;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
    background:linear-gradient(135deg,#6366f1,#0ea5e9);box-shadow:0 6px 20px rgba(99,102,241,.35)}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:999px;font-size:14px;display:none;z-index:10;
    color:#fff;background:rgba(20,28,50,.75);border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:calc(100vw - 32px);text-align:center}
  .hint{font-size:13px;color:#aab6d3;line-height:1.5}
  /* Responsive */
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    main{padding:16px 14px 32px}
  }
  @media (max-width:640px){
    header{padding:14px 12px 12px}
    p.sub{font-size:13px}
    input[type=search]{flex:1 1 100%;font-size:16px}
    select{flex:1 1 100%}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .card{padding:10px}
    .media{height:104px}
    .media img,.media video{max-width:92px;max-height:92px}
    .name{font-size:13px;min-height:36px}
    main{padding:14px 12px 28px}
  }
  @media (max-width:380px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .media{height:92px}
  }
</style>
</head>
<body>
<header>
  <div class="row"><div style="flex:1;min-width:0">
    <h1>Telegram Emoji Search</h1>
    <p class="sub">Search by name, e.g. <b style="color:#fff">ChatGPT</b>. Hover a card to play the animation (on mobile, tap the animation). Click a card to copy its ID.</p>
  </div></div>
  <div class="row">
    <input id="q" type="search" placeholder="Search emojis… e.g. ChatGPT, heart, verified, telegram" autofocus>
    <select id="pack"><option value="">All packs</option></select>
  </div>
</header>
<main>
  <div id="count"></div>
  <div id="grid" class="grid"></div>
  <button id="more" style="display:none">Load more</button>
  <p class="hint" id="hint"></p>
</main>
<div id="toast">Copied</div>
<script>
let ALL=[], filtered=[], shown=0; const PAGE=120;
const qEl=document.getElementById('q'), packEl=document.getElementById('pack'),
      grid=document.getElementById('grid'), countEl=document.getElementById('count'),
      moreBtn=document.getElementById('more'), toast=document.getElementById('toast');
function showToast(t){ toast.textContent=t; toast.style.display='block'; setTimeout(()=>toast.style.display='none',1500); }
function copyId(id){ const done=()=>showToast('Copied ID: '+id);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(done).catch(()=>fallback()); } else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=id; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); } }
function cardHTML(e){
  const name=e.name||'Unnamed';
  const media=e.webm
    ? `<video muted loop playsinline preload="none" poster="${e.thumb||''}"><source src="${e.webm}" type="video/webm"></video>`
    : (e.thumb?`<img loading="lazy" src="${e.thumb}" alt="${name}">`:`<span style="font-size:42px">${e.alt||'❓'}</span>`);
  return `<div class="card" data-id="${e.id}">
    <div class="media">${media}</div>
    <div class="name">${name}</div>
    <div class="pack">${e.pack}</div>
    <div class="id">${e.id}</div>
    <button class="copy" data-copy="${e.id}">Copy ID</button>
  </div>`; }
function render(reset){
  if(reset){ grid.innerHTML=''; shown=0; }
  const slice=filtered.slice(shown, shown+PAGE);
  grid.insertAdjacentHTML('beforeend', slice.map(cardHTML).join(''));
  shown+=slice.length;
  countEl.textContent = filtered.length
    ? `Showing ${shown} of ${filtered.length} emojis` + (filtered.length>shown?' — tap Load more for more':'')
    : 'No emojis found. Try another word, or clear the pack filter.';
  moreBtn.style.display = shown<filtered.length ? 'block':'none';
  grid.querySelectorAll('.card').forEach(c=>{
    const v=c.querySelector('video');
    if(v){
      c.addEventListener('mouseenter',()=>v.play().catch(()=>{}));
      c.addEventListener('mouseleave',()=>{v.pause(); v.currentTime=0;});
      // Touch: tapping the animation itself plays/pauses it instead of copying the ID.
      v.closest('.media').addEventListener('click',ev=>{ ev.stopPropagation(); if(v.paused){ v.play().catch(()=>{}); } else { v.pause(); } });
    }
    c.addEventListener('click',ev=>{ if(ev.target.closest('button')) return; copyId(c.dataset.id); });
  });
  grid.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation(); copyId(b.dataset.copy);}));
}
function apply(){
  const q=qEl.value.trim().toLowerCase(), pack=packEl.value;
  const words=q.split(/\s+/).filter(Boolean);
  filtered=ALL.filter(e=>{
    if(pack && e.pack!==pack) return false;
    if(!words.length) return true;
    const hay=((e.name||'')+' '+(e.alt||'')+' '+e.pack+' '+e.id).toLowerCase();
    return words.every(w=>hay.includes(w));
  });
  render(true);
}
fetch('emojis.json?v=20261027d').then(r=>r.json()).then(data=>{
  ALL=data;
  [...new Set(data.map(e=>e.pack))].sort().forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=`${p} (${data.filter(e=>e.pack===p).length})`; packEl.appendChild(o); });
  document.getElementById('hint').textContent=`${data.length} emojis loaded. Unnamed emojis can still be found by pack or alt.`;
  apply();
}).catch(()=>{ countEl.textContent='Could not load emojis.json — make sure it sits next to index.html.'; });
qEl.addEventListener('input',apply); packEl.addEventListener('change',apply);
moreBtn.addEventListener('click',()=>render(false));
</script>
</body>
</html>
