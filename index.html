<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Emoji Search</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:#0e1621;min-height:100vh}
  header{position:sticky;top:0;z-index:5;padding:18px 16px 14px;background:#17212b;border-bottom:1px solid #0e1621}
  h1{margin:0 0 4px;font-size:clamp(19px,4vw,24px)}
  p.sub{margin:0 0 12px;color:#7f91a4;font-size:14px;line-height:1.5}
  .row{display:flex;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto;width:100%}
  input[type=search]{flex:1 1 260px;min-width:0;padding:12px 14px;border-radius:10px;font-size:16px;color:#fff;outline:none;background:#242f3d;border:0}
  input[type=search]::placeholder{color:#7f91a4}
  input[type=search]:focus{box-shadow:0 0 0 2px #2aabee}
  select{flex:0 1 220px;min-width:0;padding:12px 14px;border-radius:10px;font-size:15px;color:#fff;outline:none;cursor:pointer;background:#242f3d;border:0}
  select option{background:#242f3d;color:#fff}
  main{max-width:1200px;margin:0 auto;padding:20px 16px 40px;width:100%}
  #count{color:#7f91a4;font-size:14px;margin:4px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-items:start}
  .card{padding:12px;cursor:pointer;text-align:center;border-radius:12px;background:#17212b;display:flex;flex-direction:column;gap:6px}
  .card:hover{background:#1d2a38}
  .media{height:110px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;background:transparent}
  .media img,.media video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
  .name{font-size:14px;margin:2px 0 0;line-height:1.35;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pack{font-size:12px;color:#7f91a4;word-break:break-all;line-height:1.3}
  .id{font-size:11px;color:#5f7a90;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button.copy{margin-top:2px;width:100%;padding:9px;border:0;border-radius:10px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;background:#2aabee}
  button.copy:active{background:#1d8fd1}
  #more{display:block;margin:24px auto;padding:12px 24px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;background:#2aabee}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:12px;font-size:14px;display:none;z-index:10;color:#fff;background:#242f3d;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:calc(100vw - 32px);text-align:center}
  .hint{font-size:13px;color:#7f91a4;line-height:1.5}
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
    main{padding:16px 14px 32px}
  }
  @media (max-width:640px){
    header{padding:12px 12px 10px}
    p.sub{display:none}
    input[type=search]{flex:1 1 100%;font-size:16px;padding:11px 14px}
    select{flex:1 1 100%;padding:11px 14px}
    .grid{grid-template-columns:repeat(3,1fr);gap:12px 8px}
    .card{padding:8px;gap:6px;border-radius:12px}
    .media{height:84px}
    .name{font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
    .pack,.id,button.copy{display:none}
    main{padding:14px 12px 28px}
  }
  @media (max-width:380px){
    .grid{grid-template-columns:repeat(3,1fr);gap:8px}
    .media{height:76px}
    .name{font-size:11px}
  }
</style>
</head>
<body>
<header>
  <div class="row"><div style="flex:1;min-width:0">
    <h1>Telegram Emoji Search</h1>
    <p class="sub">Search 2,412 emojis by name, pack or ID. Tap a card to copy its ID.</p>
  </div></div>
  <div class="row">
    <input id="q" type="search" placeholder="Search emojis…" autofocus>
    <select id="pack"><option value="">All packs</option></select>
  </div>
</header>
<main>
  <div id="count"></div>
  <div id="grid" class="grid"></div>
  <button id="more" style="display:none">Load more</button>
  <p class="hint" id="hint"></p>
</main>
<div id="toast">Copied</div>
<script>
let ALL=[], filtered=[], shown=0; const PAGE=120;
const qEl=document.getElementById('q'), packEl=document.getElementById('pack'),
      grid=document.getElementById('grid'), countEl=document.getElementById('count'),
      moreBtn=document.getElementById('more'), toast=document.getElementById('toast');
function showToast(t){ toast.textContent=t; toast.style.display='block'; setTimeout(()=>toast.style.display='none',1500); }
function copyId(id){ const done=()=>showToast('Copied ID: '+id);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(id).then(done).catch(()=>fallback()); } else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=id; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); } }
function cardHTML(e){
  const name=e.name||'Unnamed';
  const media=e.webm
    ? `<video muted loop playsinline preload="none" poster="${e.thumb||''}"><source src="${e.webm}" type="video/webm"></video>`
    : (e.thumb?`<img loading="lazy" src="${e.thumb}" alt="${name}">`:`<span style="font-size:42px">${e.alt||'❓'}</span>`);
  return `<div class="card" data-id="${e.id}">
    <div class="media">${media}</div>
    <div class="name">${name}</div>
    <div class="pack">${e.pack}</div>
    <div class="id">${e.id}</div>
    <button class="copy" data-copy="${e.id}">Copy ID</button>
  </div>`; }
function render(reset){
  if(reset){ grid.innerHTML=''; shown=0; }
  const slice=filtered.slice(shown, shown+PAGE);
  grid.insertAdjacentHTML('beforeend', slice.map(cardHTML).join(''));
  shown+=slice.length;
  countEl.textContent = filtered.length
    ? `Showing ${shown} of ${filtered.length} emojis` + (filtered.length>shown?' — tap Load more for more':'')
    : 'No emojis found. Try another word, or clear the pack filter.';
  moreBtn.style.display = shown<filtered.length ? 'block':'none';
  grid.querySelectorAll('.card').forEach(c=>{
    const v=c.querySelector('video');
    if(v){
      c.addEventListener('mouseenter',()=>v.play().catch(()=>{}));
      c.addEventListener('mouseleave',()=>{v.pause(); v.currentTime=0;});
      // Touch: tapping the animation itself plays/pauses it instead of copying the ID.
      v.closest('.media').addEventListener('click',ev=>{ ev.stopPropagation(); if(v.paused){ v.play().catch(()=>{}); } else { v.pause(); } });
    }
    c.addEventListener('click',ev=>{ if(ev.target.closest('button')) return; copyId(c.dataset.id); });
  });
  grid.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation(); copyId(b.dataset.copy);}));
}
function apply(){
  const q=qEl.value.trim().toLowerCase(), pack=packEl.value;
  const words=q.split(/\s+/).filter(Boolean);
  filtered=ALL.filter(e=>{
    if(pack && e.pack!==pack) return false;
    if(!words.length) return true;
    const hay=((e.name||'')+' '+(e.alt||'')+' '+e.pack+' '+e.id).toLowerCase();
    return words.every(w=>hay.includes(w));
  });
  render(true);
}
fetch('emojis.json?v=20261027e').then(r=>r.json()).then(data=>{
  ALL=data;
  [...new Set(data.map(e=>e.pack))].sort().forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=`${p} (${data.filter(e=>e.pack===p).length})`; packEl.appendChild(o); });
  document.getElementById('hint').textContent=`${data.length} emojis loaded. Unnamed emojis can still be found by pack or alt.`;
  apply();
}).catch(()=>{ countEl.textContent='Could not load emojis.json — make sure it sits next to index.html.'; });
qEl.addEventListener('input',apply); packEl.addEventListener('change',apply);
moreBtn.addEventListener('click',()=>render(false));
</script>
</body>
</html>
